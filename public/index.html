<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 Global Shorts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1240px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.hero h1{margin:0}.hero p{margin:6px 0;color:#9aa4b2}.panel{background:#13171d;border:1px solid #252b34;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:grid;grid-template-columns:1.2fr 1fr 1fr 120px;gap:10px}input,select,button{font:inherit;border-radius:11px;border:1px solid #303844;background:#0e1217;color:#fff;padding:11px}button{cursor:pointer;background:#fff;color:#111;font-weight:800}button.secondary{background:#1b222b;color:#fff}.actions{display:flex;gap:8px;align-items:center}.link,.badge{font-size:12px;padding:8px 10px;border:1px solid #303844;border-radius:999px;color:#fff;text-decoration:none;background:#1c232c}.terms{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:7px 10px;border:1px solid #303844;border-radius:999px;color:#cdd5df;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{border:2px solid transparent;background:#10141a;border-radius:14px;overflow:hidden}.card.selected{border-color:#fff}.card video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#000;display:block}.meta{padding:10px;font-size:12px;color:#aab4c1}.selectBtn{width:calc(100% - 20px);margin:0 10px 10px}.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.preview{width:270px;height:480px;background:#000;border-radius:18px;overflow:hidden;border:1px solid #333;margin:auto;display:flex;flex-direction:column}.titlebar{height:72px;display:flex;align-items:flex-start;justify-content:center;padding:8px 14px;text-align:center;font-weight:900}.scene{flex:1;position:relative;background:#111;overflow:hidden}.scene video{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:5%;right:5%;bottom:32px;font-weight:800;text-align:center;text-shadow:0 2px 8px #000}.captions input{width:100%;margin:5px 0}.styleGrid,.musicGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.control{background:#0f1318;border:1px solid #272e37;border-radius:12px;padding:10px}.control label{display:flex;justify-content:space-between;font-size:12px;color:#b9c2ce;margin-bottom:7px}.colorRow{display:grid;grid-template-columns:1fr 58px;gap:7px}.small,.status,.duration{font-size:12px;color:#9aa4b2}.divider{height:1px;background:#252b34;margin:18px 0}.presetRow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.musicBox{display:grid;gap:10px}.musicBox audio{width:100%}.musicName{font-size:13px;color:#dce3eb}.previewWrap{position:sticky;top:16px}@media(max-width:860px){.row,.editor,.styleGrid,.musicGrid{grid-template-columns:1fr}.previewWrap{position:static}.hero{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<div class="hero"><div><h1>M3 Global Shorts</h1><p>Stock Video × Music Segment × Global Target</p></div><div class="actions"><a class="link" href="/admin">API 설정</a><span class="badge" id="health">checking...</span></div></div>
<div class="panel"><div class="row"><input id="subject" value="New York" placeholder="New York, sunset, rain..."><select id="target"><option value="ja">🇯🇵 일본</option><option value="en">🌎 영어권</option><option value="ar">🇸🇦 아랍권</option></select><select id="mood"><option value="dreamy">dreamy</option><option value="nostalgic">nostalgic</option><option value="freedom">freedom</option><option value="calm">calm</option><option value="romantic">romantic</option><option value="energetic">energetic</option></select><button id="searchBtn">영상 검색</button></div><div class="terms" id="terms"></div></div>
<div class="panel"><h2>영상 후보 <span class="small">재생해서 확인 후 최대 6개 선택</span></h2><div id="videos" class="grid"><div class="small">검색 버튼을 눌러 시작하세요</div></div><div id="durationInfo" class="duration">선택된 영상 없음</div></div>
<div class="panel"><h2>🎵 음악</h2><div class="musicBox"><input id="musicFile" type="file" accept="audio/*"><button class="secondary" id="uploadMusicBtn">음원 업로드</button><div id="musicName" class="musicName">업로드된 음원 없음</div><audio id="musicPlayer" controls></audio><div class="musicGrid"><div class="control"><label>사용 시작 <span id="musicStartVal">0.0s</span></label><input id="musicStart" type="range" min="0" max="0" step="0.1" value="0"></div><div class="control"><label>사용 길이 <span id="musicLengthVal">0.0s</span></label><input id="musicLength" type="range" min="1" max="1" step="0.1" value="1"></div><div class="control"><label>볼륨 <span id="musicVolumeVal">90%</span></label><input id="musicVolume" type="range" min="0" max="200" step="5" value="90"></div><div class="control"><label>영상 길이</label><div class="small">음악 구간이 짧으면 그 길이에 맞춰 영상도 잘립니다</div></div></div></div></div>
<div class="panel editor"><div><h2>카피</h2><input id="title" style="width:100%"><div class="captions" id="captions"></div><div class="divider"></div><h2>스타일 편집</h2><div class="presetRow"><button class="secondary" data-preset="minimal">Minimal</button><button class="secondary" data-preset="cinematic">Cinematic</button><button class="secondary" data-preset="lyrics">Lyrics</button></div><div class="styleGrid">
<div class="control"><label>제목 크기 <span id="titleSizeVal">62</span></label><input id="titleSize" type="range" min="28" max="110" value="62"></div><div class="control"><label>제목 정렬</label><select id="titleAlign"><option value="left">왼쪽</option><option value="center" selected>가운데</option><option value="right">오른쪽</option></select></div>
<div class="control"><label>제목 색</label><div class="colorRow"><input id="titleColorText" value="#FFFFFF"><input id="titleColor" type="color" value="#ffffff"></div></div><div class="control"><label>상단 배경색</label><div class="colorRow"><input id="titleBgText" value="#000000"><input id="titleBg" type="color" value="#000000"></div></div>
<div class="control"><label>상단 높이 <span id="barHeightVal">288</span></label><input id="barHeight" type="range" min="160" max="460" value="288"></div><div class="control"><label>제목 Y <span id="titleYVal">95</span></label><input id="titleY" type="range" min="20" max="360" value="95"></div>
<div class="control"><label>자막 크기 <span id="captionSizeVal">54</span></label><input id="captionSize" type="range" min="24" max="100" value="54"></div><div class="control"><label>자막 정렬</label><select id="captionAlign"><option value="left">왼쪽</option><option value="center" selected>가운데</option><option value="right">오른쪽</option></select></div>
<div class="control"><label>자막 색</label><div class="colorRow"><input id="captionColorText" value="#FFFFFF"><input id="captionColor" type="color" value="#ffffff"></div></div><div class="control"><label>테두리 색</label><div class="colorRow"><input id="strokeColorText" value="#000000"><input id="strokeColor" type="color" value="#000000"></div></div>
<div class="control"><label>테두리 두께 <span id="strokeWidthVal">3</span></label><input id="strokeWidth" type="range" min="0" max="10" value="3"></div><div class="control"><label>하단 여백 <span id="captionBottomVal">270</span></label><input id="captionBottom" type="range" min="80" max="700" value="270"></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="secondary" id="regenBtn">카피 다시 생성</button><button id="renderBtn">음악 포함 렌더</button></div><div id="status" class="status"></div></div>
<div class="previewWrap"><div class="preview"><div class="titlebar" id="previewTitle">ニューヨークの夜が美しすぎる</div><div class="scene"><video id="previewVideo" controls muted playsinline loop></video><div class="caption" id="previewCaption">ただ、この景色を見ていたい</div></div></div><div class="small" style="text-align:center;margin-top:8px">선택 영상 미리보기</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let videos=[],selected=new Set(),currentCaptions=[],music=null;
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
async function health(){try{const d=await json('/api/health');$('health').textContent=`Pexels ${d.pexels?'ON':'OFF'} · Pixabay ${d.pixabay?'ON':'OFF'}`}catch{$('health').textContent='API ERROR'}}
function selectedClips(){return [...selected].map(i=>videos[i]).filter(Boolean)}
function totalVideo(){return selectedClips().reduce((s,v)=>s+(Number(v.duration)>0?Number(v.duration):5),0)}
function updateDuration(){const t=totalVideo();$('durationInfo').textContent=t?`선택 ${selected.size}개 · 원본 합계 ${t.toFixed(1)}초`:'선택된 영상 없음'}
function setPreview(v){const p=$('previewVideo');if(!v?.downloadUrl){p.removeAttribute('src');p.load();return}p.src=v.downloadUrl;p.load()}
function renderCards(){const root=$('videos');root.innerHTML='';videos.forEach((v,i)=>{const el=document.createElement('div');el.className='card'+(selected.has(i)?' selected':'');const vv=document.createElement('video');vv.src=v.downloadUrl;vv.poster=v.preview||'';vv.controls=true;vv.muted=true;vv.playsInline=true;vv.preload='metadata';const m=document.createElement('div');m.className='meta';m.textContent=`${v.provider.toUpperCase()} · ${v.orientation} · ${v.duration||'?'}s · ${v.creator||''}`;const b=document.createElement('button');b.className='secondary selectBtn';b.textContent=selected.has(i)?'선택 해제':'이 영상 선택';b.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);renderCards();updateDuration();setPreview(selectedClips()[0]||v)};el.append(vv,m,b);root.appendChild(el)});if(videos[0]&&!selected.size)setPreview(videos[0])}
function renderCaptions(){const r=$('captions');r.innerHTML='';currentCaptions.forEach((c,i)=>{const x=document.createElement('input');x.value=c;x.oninput=e=>{currentCaptions[i]=e.target.value;if(i===0)$('previewCaption').textContent=e.target.value};r.appendChild(x)});$('previewCaption').textContent=currentCaptions[0]||''}
async function makeCopy(){const d=await json('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject:$('subject').value,mood:$('mood').value,duration:music?+$('musicLength').value:(totalVideo()||20),target:$('target').value})});$('title').value=d.title;$('previewTitle').textContent=d.title;currentCaptions=d.captions;renderCaptions();$('previewTitle').dir=d.direction||'ltr';$('previewCaption').dir=d.direction||'ltr'}
async function search(term){$('videos').innerHTML='<div class="small">검색 중...</div>';selected.clear();updateDuration();const q=encodeURIComponent($('subject').value);const d=await json('/api/search?q='+q+(term?'&term='+encodeURIComponent(term):''));videos=d.videos;$('terms').innerHTML='';d.terms.forEach(t=>{const c=document.createElement('span');c.className='chip';c.textContent=t;c.onclick=()=>search(t);$('terms').appendChild(c)});renderCards();await makeCopy()}
function cleanHex(v,f){const x=String(v||'').trim().toUpperCase();return /^#[0-9A-F]{6}$/.test(x)?x:f}
function stylePayload(){return{title:{fontSize:+$('titleSize').value,color:cleanHex($('titleColorText').value,'#FFFFFF'),backgroundColor:cleanHex($('titleBgText').value,'#000000'),backgroundHeight:+$('barHeight').value,y:+$('titleY').value,align:$('titleAlign').value},caption:{fontSize:+$('captionSize').value,color:cleanHex($('captionColorText').value,'#FFFFFF'),strokeColor:cleanHex($('strokeColorText').value,'#000000'),strokeWidth:+$('strokeWidth').value,bottom:+$('captionBottom').value,align:$('captionAlign').value}}}
function applyPreview(){const s=stylePayload(),scale=270/1080;[['titleSizeVal',s.title.fontSize],['barHeightVal',s.title.backgroundHeight],['titleYVal',s.title.y],['captionSizeVal',s.caption.fontSize],['strokeWidthVal',s.caption.strokeWidth],['captionBottomVal',s.caption.bottom]].forEach(([id,v])=>$(id).textContent=v);const b=$('previewTitle');b.style.height=(s.title.backgroundHeight*scale)+'px';b.style.minHeight=(s.title.backgroundHeight*scale)+'px';b.style.background=s.title.backgroundColor;b.style.color=s.title.color;b.style.fontSize=Math.max(10,s.title.fontSize*scale)+'px';b.style.paddingTop=Math.max(2,s.title.y*scale)+'px';b.style.textAlign=s.title.align;const c=$('previewCaption');c.style.fontSize=Math.max(10,s.caption.fontSize*scale)+'px';c.style.color=s.caption.color;c.style.webkitTextStroke=`${Math.max(.3,s.caption.strokeWidth*scale)}px ${s.caption.strokeColor}`;c.style.textAlign=s.caption.align;c.style.bottom=Math.max(8,s.caption.bottom*scale)+'px'}
function syncColor(t,c){$(t).oninput=()=>{const v=cleanHex($(t).value,null);if(v){$(c).value=v.toLowerCase();applyPreview()}};$(c).oninput=()=>{$(t).value=$(c).value.toUpperCase();applyPreview()}}
function preset(n){const p={minimal:['#FFFFFF','#000000','#FFFFFF',62,54],cinematic:['#F3EBDD','#080808','#F7F2E8',58,48],lyrics:['#FFFFFF','#000000','#FFD95A',56,58]}[n];if(!p)return;$('titleColorText').value=p[0];$('titleBgText').value=p[1];$('captionColorText').value=p[2];$('titleColor').value=p[0].toLowerCase();$('titleBg').value=p[1].toLowerCase();$('captionColor').value=p[2].toLowerCase();$('titleSize').value=p[3];$('captionSize').value=p[4];applyPreview()}
function updateMusicLabels(){$('musicStartVal').textContent=(+$('musicStart').value).toFixed(1)+'s';$('musicLengthVal').textContent=(+$('musicLength').value).toFixed(1)+'s';$('musicVolumeVal').textContent=$('musicVolume').value+'%'}
$('uploadMusicBtn').onclick=async()=>{try{const f=$('musicFile').files[0];if(!f)throw new Error('음원 파일을 선택하세요');$('musicName').textContent='업로드 중...';const r=await fetch('/api/music/upload',{method:'POST',headers:{'content-type':f.type||'application/octet-stream','x-file-name':encodeURIComponent(f.name)},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||'업로드 실패');music=d;$('musicName').textContent=`${d.originalName} · ${d.duration}s`;$('musicPlayer').src=d.url;$('musicStart').max=Math.max(0,d.duration-.5);$('musicStart').value=0;$('musicLength').max=Math.max(1,d.duration);$('musicLength').value=Math.min(d.duration,totalVideo()||d.duration);updateMusicLabels();await makeCopy()}catch(e){$('musicName').textContent='실패: '+e.message}};
$('musicStart').oninput=()=>{if(music){const start=+$('musicStart').value;const max=Math.max(.5,music.duration-start);$('musicLength').max=max;if(+$('musicLength').value>max)$('musicLength').value=max;$('musicPlayer').currentTime=start}updateMusicLabels()};$('musicLength').oninput=updateMusicLabels;$('musicVolume').oninput=updateMusicLabels;
$('searchBtn').onclick=()=>search();$('regenBtn').onclick=makeCopy;$('target').onchange=makeCopy;$('title').oninput=e=>$('previewTitle').textContent=e.target.value;['titleSize','titleAlign','barHeight','titleY','captionSize','captionAlign','strokeWidth','captionBottom'].forEach(id=>$(id).oninput=applyPreview);syncColor('titleColorText','titleColor');syncColor('titleBgText','titleBg');syncColor('captionColorText','captionColor');syncColor('strokeColorText','strokeColor');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>preset(b.dataset.preset));
$('renderBtn').onclick=async()=>{try{const clips=selectedClips();if(!clips.length)throw new Error('영상을 먼저 선택하세요');$('status').textContent='렌더링 중...';const musicPayload=music?{url:music.url,start:+$('musicStart').value,duration:+$('musicLength').value,volume:+$('musicVolume').value/100}:null;const d=await json('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clips,title:$('title').value,captions:currentCaptions,style:stylePayload(),target:$('target').value,music:musicPayload})});$('status').innerHTML=`완료 · ${d.duration}s${d.music?' · 음악 포함':''}<br><a href="${d.url}" target="_blank" style="color:white">완성 MP4 열기</a>`}catch(e){$('status').textContent='실패: '+e.message}};
health();applyPreview();updateMusicLabels();
</script></body></html>
