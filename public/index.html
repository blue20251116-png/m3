<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M3 Japanese Shorts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0 0;color:#9aa4b2}.actions{display:flex;gap:8px;align-items:center}.link,.badge{font-size:12px;padding:8px 10px;border:1px solid #303844;border-radius:999px;color:#fff;text-decoration:none;background:#1c232c}.panel{background:#13171d;border:1px solid #252b34;border-radius:18px;padding:20px;margin-bottom:18px}.row{display:grid;grid-template-columns:2fr 1fr 120px;gap:12px}input,select,button{font:inherit;border-radius:12px;border:1px solid #303844;background:#0e1217;color:#fff;padding:12px}input[type=color]{padding:4px;height:44px;width:58px}input[type=range]{padding:0;width:100%}button{cursor:pointer;background:#fff;color:#111;font-weight:800}button.secondary{background:#1b222b;color:#fff}.terms{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{padding:7px 10px;border:1px solid #303844;border-radius:999px;color:#cdd5df;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{border:2px solid transparent;background:#10141a;border-radius:15px;overflow:hidden;cursor:pointer}.card.selected{border-color:#fff}.card img{width:100%;aspect-ratio:9/14;object-fit:cover;background:#222}.meta{padding:10px;font-size:12px;color:#aab4c1}.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}.previewWrap{position:sticky;top:18px}.preview{width:270px;height:480px;background:#000;border-radius:18px;overflow:hidden;border:1px solid #333;margin:auto;display:flex;flex-direction:column}.titlebar{height:72px;display:flex;align-items:flex-start;justify-content:center;padding:8px 14px;text-align:center;font-weight:900;font-size:18px;line-height:1.25;overflow:hidden}.scene{flex:1;background:linear-gradient(150deg,#313b48,#111);position:relative;display:flex;align-items:flex-end;justify-content:center;padding:40px 16px;background-size:cover;background-position:center}.caption{font-size:17px;font-weight:800;text-align:center;text-shadow:0 2px 8px #000;max-width:90%;line-height:1.3}.captions input{width:100%;margin:5px 0}.status{white-space:pre-wrap;color:#aab4c1;margin-top:12px}.download{display:inline-block;margin-top:12px;color:#fff}.small{font-size:12px;color:#8b96a5}.styleGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.control{background:#0f1318;border:1px solid #272e37;border-radius:14px;padding:12px}.control label{display:flex;justify-content:space-between;gap:10px;color:#b9c2ce;font-size:12px;margin-bottom:8px}.control select{width:100%;padding:9px}.sectionTitle{margin:22px 0 6px;font-size:15px}.presetRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.preset{padding:8px 10px;font-size:12px}.colorRow{display:grid;grid-template-columns:1fr 72px;gap:8px}.value{color:#fff;font-variant-numeric:tabular-nums}.divider{height:1px;background:#252b34;margin:20px 0}.duration{margin-top:10px;color:#d8dee7;font-size:13px}@media(max-width:860px){.row,.editor{grid-template-columns:1fr}.hero{display:block}.actions{margin-top:12px}.previewWrap{position:static}.preview{width:240px;height:426px}.styleGrid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div><h1>M3 Japanese Shorts</h1><p>Stock Video × Japanese Emotion × Shorts</p></div><div class="actions"><a class="link" href="/admin">API 설정</a><span class="badge" id="health">checking...</span></div></div>
<div class="panel"><div class="row"><input id="subject" value="New York" placeholder="New York, sunset, rain, airplane window..."/><select id="mood"><option value="dreamy">dreamy</option><option value="nostalgic">nostalgic</option><option value="freedom">freedom</option><option value="calm">calm</option><option value="romantic">romantic</option><option value="energetic">energetic</option></select><button id="searchBtn">영상 검색</button></div><div class="terms" id="terms"></div></div>
<div class="panel"><h2>영상 후보 <span class="small">원하는 만큼 선택 · 최대 6개</span></h2><div id="videos" class="grid"><div class="small">검색 버튼을 눌러 시작하세요</div></div><div id="durationInfo" class="duration">선택된 영상 없음</div></div>
<div class="panel editor"><div>
<h2>일본어 카피</h2><label class="small">상단 제목</label><input id="title" style="width:100%"/><div class="captions" id="captions"></div><div class="divider"></div>
<h2>스타일 편집</h2><div class="presetRow"><button class="secondary preset" data-preset="minimal">Minimal</button><button class="secondary preset" data-preset="cinematic">Cinematic</button><button class="secondary preset" data-preset="lyrics">Lyrics</button></div>
<h3 class="sectionTitle">상단 제목</h3><div class="styleGrid">
<div class="control"><label>폰트 크기 <span class="value" id="titleSizeVal">62</span></label><input id="titleSize" type="range" min="28" max="110" value="62"></div>
<div class="control"><label>정렬</label><select id="titleAlign"><option value="left">왼쪽</option><option value="center" selected>가운데</option><option value="right">오른쪽</option></select></div>
<div class="control"><label>글자색</label><div class="colorRow"><input id="titleColorText" value="#FFFFFF"><input id="titleColor" type="color" value="#ffffff"></div></div>
<div class="control"><label>상단 배경색</label><div class="colorRow"><input id="titleBgText" value="#000000"><input id="titleBg" type="color" value="#000000"></div></div>
<div class="control"><label>상단 높이 <span class="value" id="barHeightVal">288px</span></label><input id="barHeight" type="range" min="160" max="460" value="288"></div>
<div class="control"><label>제목 Y 위치 <span class="value" id="titleYVal">95px</span></label><input id="titleY" type="range" min="20" max="360" value="95"></div></div>
<h3 class="sectionTitle">영상 자막</h3><div class="styleGrid">
<div class="control"><label>폰트 크기 <span class="value" id="captionSizeVal">54</span></label><input id="captionSize" type="range" min="24" max="100" value="54"></div>
<div class="control"><label>정렬</label><select id="captionAlign"><option value="left">왼쪽</option><option value="center" selected>가운데</option><option value="right">오른쪽</option></select></div>
<div class="control"><label>글자색</label><div class="colorRow"><input id="captionColorText" value="#FFFFFF"><input id="captionColor" type="color" value="#ffffff"></div></div>
<div class="control"><label>테두리 색</label><div class="colorRow"><input id="strokeColorText" value="#000000"><input id="strokeColor" type="color" value="#000000"></div></div>
<div class="control"><label>테두리 두께 <span class="value" id="strokeWidthVal">3</span></label><input id="strokeWidth" type="range" min="0" max="10" value="3"></div>
<div class="control"><label>하단 여백 <span class="value" id="captionBottomVal">270px</span></label><input id="captionBottom" type="range" min="80" max="700" value="270"></div></div>
<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="secondary" id="regenBtn">카피 다시 생성</button><button id="renderBtn">원본 길이대로 렌더</button></div><div class="status" id="status"></div></div>
<div class="previewWrap"><div class="preview"><div class="titlebar" id="previewTitle">ニューヨークの夜が美しすぎる</div><div class="scene" id="previewScene"><div class="caption" id="previewCaption">ただ、この景色を見ていたい</div></div></div><div class="small" style="text-align:center;margin-top:10px">실시간 스타일 미리보기</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let videos=[],selected=new Set(),currentCaptions=[];
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
async function health(){try{const d=await json('/api/health');$('health').textContent=`Pexels ${d.pexels?'ON':'OFF'} · Pixabay ${d.pixabay?'ON':'OFF'}`}catch{$('health').textContent='API ERROR'}}
function selectedClips(){return [...selected].map(i=>videos[i]).filter(Boolean)}
function updateDuration(){const clips=selectedClips();const total=clips.reduce((s,v)=>s+(Number(v.duration)>0?Number(v.duration):5),0);$('durationInfo').textContent=clips.length?`선택 ${clips.length}개 · 예상 최종 길이 ${total.toFixed(1)}초 · 각 원본 길이를 그대로 사용`:'선택된 영상 없음'}
function renderCards(){const root=$('videos');root.innerHTML='';videos.forEach((v,i)=>{const el=document.createElement('div');el.className='card'+(selected.has(i)?' selected':'');el.innerHTML=`<img src="${v.preview||''}" loading="lazy"><div class="meta">${v.provider.toUpperCase()} · ${v.orientation}<br>${v.duration?`${v.duration}s · `:''}${v.creator||''}</div>`;el.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);renderCards();updatePreviewScene();updateDuration()};root.appendChild(el)})}
function updatePreviewScene(){const first=[...selected][0];const v=Number.isInteger(first)?videos[first]:videos[0];$('previewScene').style.backgroundImage=v?.preview?`url('${v.preview}')`:''}
function renderCaptions(){const root=$('captions');root.innerHTML='';currentCaptions.forEach((c,i)=>{const inp=document.createElement('input');inp.value=c;inp.oninput=e=>{currentCaptions[i]=e.target.value;if(i===0)$('previewCaption').textContent=e.target.value};root.appendChild(inp)});$('previewCaption').textContent=currentCaptions[0]||''}
async function makeCopy(){const total=selectedClips().reduce((s,v)=>s+(Number(v.duration)>0?Number(v.duration):5),0)||20;const d=await json('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject:$('subject').value,mood:$('mood').value,duration:total})});$('title').value=d.title;$('previewTitle').textContent=d.title;currentCaptions=d.captions;renderCaptions()}
async function search(term){$('videos').innerHTML='<div class="small">검색 중...</div>';selected.clear();updateDuration();const q=encodeURIComponent($('subject').value);const u='/api/search?q='+q+(term?'&term='+encodeURIComponent(term):'');const d=await json(u);videos=d.videos;$('terms').innerHTML='';d.terms.forEach(t=>{const c=document.createElement('span');c.className='chip';c.textContent=t;c.onclick=()=>search(t);$('terms').appendChild(c)});renderCards();updatePreviewScene();await makeCopy()}
function cleanHex(v,fallback){const x=String(v||'').trim().toUpperCase();return /^#[0-9A-F]{6}$/.test(x)?x:fallback}
function syncColor(textId,colorId){const text=$(textId),picker=$(colorId);text.oninput=()=>{const v=cleanHex(text.value,null);if(v){picker.value=v.toLowerCase();applyPreview()}};picker.oninput=()=>{text.value=picker.value.toUpperCase();applyPreview()}}
function stylePayload(){return{title:{fontSize:Number($('titleSize').value),color:cleanHex($('titleColorText').value,'#FFFFFF'),backgroundColor:cleanHex($('titleBgText').value,'#000000'),backgroundHeight:Number($('barHeight').value),y:Number($('titleY').value),align:$('titleAlign').value},caption:{fontSize:Number($('captionSize').value),color:cleanHex($('captionColorText').value,'#FFFFFF'),strokeColor:cleanHex($('strokeColorText').value,'#000000'),strokeWidth:Number($('strokeWidth').value),bottom:Number($('captionBottom').value),align:$('captionAlign').value}}}
function applyPreview(){const s=stylePayload();const scale=270/1080;$('titleSizeVal').textContent=s.title.fontSize;$('barHeightVal').textContent=s.title.backgroundHeight+'px';$('titleYVal').textContent=s.title.y+'px';$('captionSizeVal').textContent=s.caption.fontSize;$('strokeWidthVal').textContent=s.caption.strokeWidth;$('captionBottomVal').textContent=s.caption.bottom+'px';const bar=$('previewTitle');bar.style.height=(s.title.backgroundHeight*scale)+'px';bar.style.minHeight=(s.title.backgroundHeight*scale)+'px';bar.style.background=s.title.backgroundColor;bar.style.color=s.title.color;bar.style.fontSize=Math.max(10,s.title.fontSize*scale)+'px';bar.style.paddingTop=Math.max(2,s.title.y*scale)+'px';bar.style.justifyContent=s.title.align==='left'?'flex-start':s.title.align==='right'?'flex-end':'center';bar.style.textAlign=s.title.align;const cap=$('previewCaption');cap.style.fontSize=Math.max(10,s.caption.fontSize*scale)+'px';cap.style.color=s.caption.color;cap.style.webkitTextStroke=`${Math.max(.3,s.caption.strokeWidth*scale)}px ${s.caption.strokeColor}`;cap.style.textAlign=s.caption.align;cap.style.marginBottom=Math.max(0,(s.caption.bottom-270)*scale)+'px'}
function setPreset(name){const p={minimal:{titleSize:62,titleColor:'#FFFFFF',titleBg:'#000000',barHeight:288,titleY:95,captionSize:54,captionColor:'#FFFFFF',strokeColor:'#000000',strokeWidth:3,captionBottom:270},cinematic:{titleSize:58,titleColor:'#F3EBDD',titleBg:'#080808',barHeight:300,titleY:98,captionSize:48,captionColor:'#F7F2E8',strokeColor:'#000000',strokeWidth:2,captionBottom:250},lyrics:{titleSize:56,titleColor:'#FFFFFF',titleBg:'#000000',barHeight:270,titleY:88,captionSize:58,captionColor:'#FFD95A',strokeColor:'#000000',strokeWidth:4,captionBottom:300}}[name];if(!p)return;$('titleSize').value=p.titleSize;$('titleColorText').value=p.titleColor;$('titleColor').value=p.titleColor.toLowerCase();$('titleBgText').value=p.titleBg;$('titleBg').value=p.titleBg.toLowerCase();$('barHeight').value=p.barHeight;$('titleY').value=p.titleY;$('captionSize').value=p.captionSize;$('captionColorText').value=p.captionColor;$('captionColor').value=p.captionColor.toLowerCase();$('strokeColorText').value=p.strokeColor;$('strokeColor').value=p.strokeColor.toLowerCase();$('strokeWidth').value=p.strokeWidth;$('captionBottom').value=p.captionBottom;applyPreview()}
$('searchBtn').onclick=()=>search();$('regenBtn').onclick=makeCopy;$('title').oninput=e=>$('previewTitle').textContent=e.target.value;['titleSize','barHeight','titleY','captionSize','strokeWidth','captionBottom','titleAlign','captionAlign'].forEach(id=>$(id).oninput=applyPreview);syncColor('titleColorText','titleColor');syncColor('titleBgText','titleBg');syncColor('captionColorText','captionColor');syncColor('strokeColorText','strokeColor');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>setPreset(b.dataset.preset));
$('renderBtn').onclick=async()=>{try{const clips=selectedClips();if(!clips.length)throw new Error('영상 클립을 먼저 선택하세요');$('status').textContent='원본 길이 기준으로 렌더링 중...';const d=await json('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clips,title:$('title').value,captions:currentCaptions,style:stylePayload()})});$('status').innerHTML=`완료 · ${d.duration}초 · ${d.filename}<br><a class="download" href="${d.url}" target="_blank">완성 MP4 열기</a>`}catch(e){$('status').textContent='실패: '+e.message}};
health();applyPreview();updateDuration();
</script></body></html>
