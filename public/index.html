<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M3 Japanese Shorts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0 0;color:#9aa4b2}.panel{background:#13171d;border:1px solid #252b34;border-radius:18px;padding:20px;margin-bottom:18px}.row{display:grid;grid-template-columns:2fr 1fr 120px;gap:12px}input,select,button,textarea{font:inherit;border-radius:12px;border:1px solid #303844;background:#0e1217;color:#fff;padding:12px}button{cursor:pointer;background:#fff;color:#111;font-weight:800}button.secondary{background:#1b222b;color:#fff}.terms{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{padding:7px 10px;border:1px solid #303844;border-radius:999px;color:#cdd5df;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{border:2px solid transparent;background:#10141a;border-radius:15px;overflow:hidden;cursor:pointer}.card.selected{border-color:#fff}.card img{width:100%;aspect-ratio:9/14;object-fit:cover;background:#222}.meta{padding:10px;font-size:12px;color:#aab4c1}.preview{width:270px;height:480px;background:#000;border-radius:18px;overflow:hidden;border:1px solid #333;margin:auto}.titlebar{height:72px;display:flex;align-items:center;justify-content:center;padding:8px 14px;text-align:center;font-weight:900;font-size:18px}.scene{height:408px;background:linear-gradient(150deg,#313b48,#111);position:relative;display:flex;align-items:flex-end;justify-content:center;padding:40px 16px}.caption{font-size:17px;font-weight:800;text-align:center;text-shadow:0 2px 8px #000}.editor{display:grid;grid-template-columns:1fr 320px;gap:20px}.captions input{width:100%;margin:5px 0}.status{white-space:pre-wrap;color:#aab4c1;margin-top:12px}.download{display:inline-block;margin-top:12px;color:#fff}.small{font-size:12px;color:#8b96a5}.badge{font-size:12px;padding:5px 8px;background:#1c232c;border-radius:999px}@media(max-width:760px){.row,.editor{grid-template-columns:1fr}.hero{display:block}.preview{width:240px;height:426px}.scene{height:362px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div><h1>M3 Japanese Shorts</h1><p>Stock Video × Japanese Emotion × Shorts</p></div><span class="badge" id="health">checking...</span></div>
<div class="panel"><div class="row"><input id="subject" value="New York" placeholder="New York, sunset, rain, airplane window..."/><select id="mood"><option value="dreamy">dreamy</option><option value="nostalgic">nostalgic</option><option value="freedom">freedom</option><option value="calm">calm</option><option value="romantic">romantic</option><option value="energetic">energetic</option></select><button id="searchBtn">영상 검색</button></div><div class="terms" id="terms"></div></div>
<div class="panel"><h2>영상 후보 <span class="small">3~6개 선택 권장</span></h2><div id="videos" class="grid"><div class="small">검색 버튼을 눌러 시작하세요</div></div></div>
<div class="panel editor"><div><h2>일본어 카피</h2><label class="small">상단 제목</label><input id="title" style="width:100%"/><div class="captions" id="captions"></div><div style="display:flex;gap:10px;margin-top:12px"><button class="secondary" id="regenBtn">카피 다시 생성</button><button id="renderBtn">20초 렌더</button></div><div class="status" id="status"></div></div><div><div class="preview"><div class="titlebar" id="previewTitle">ニューヨークの夜が美しすぎる</div><div class="scene"><div class="caption" id="previewCaption">ただ、この景色を見ていたい</div></div></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);let videos=[],selected=new Set(),currentCaptions=[];
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
async function health(){try{const d=await json('/api/health');$('health').textContent=`Pexels ${d.pexels?'ON':'OFF'} · Pixabay ${d.pixabay?'ON':'OFF'}`}catch{$('health').textContent='API ERROR'}}
function renderCards(){const root=$('videos');root.innerHTML='';videos.forEach((v,i)=>{const el=document.createElement('div');el.className='card'+(selected.has(i)?' selected':'');el.innerHTML=`<img src="${v.preview||''}" loading="lazy"><div class="meta">${v.provider.toUpperCase()} · ${v.orientation}<br>${v.creator||''}</div>`;el.onclick=()=>{selected.has(i)?selected.delete(i):selected.add(i);renderCards()};root.appendChild(el)})}
function renderCaptions(){const root=$('captions');root.innerHTML='';currentCaptions.forEach((c,i)=>{const inp=document.createElement('input');inp.value=c;inp.oninput=e=>{currentCaptions[i]=e.target.value;if(i===0)$('previewCaption').textContent=e.target.value};root.appendChild(inp)});$('previewCaption').textContent=currentCaptions[0]||''}
async function makeCopy(){const d=await json('/api/copy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject:$('subject').value,mood:$('mood').value,duration:20})});$('title').value=d.title;$('previewTitle').textContent=d.title;currentCaptions=d.captions;renderCaptions()}
async function search(term){$('videos').innerHTML='<div class="small">검색 중...</div>';selected.clear();const q=encodeURIComponent($('subject').value);const u='/api/search?q='+q+(term?'&term='+encodeURIComponent(term):'');const d=await json(u);videos=d.videos;$('terms').innerHTML='';d.terms.forEach(t=>{const c=document.createElement('span');c.className='chip';c.textContent=t;c.onclick=()=>search(t);$('terms').appendChild(c)});renderCards();await makeCopy()}
$('searchBtn').onclick=()=>search();$('regenBtn').onclick=makeCopy;$('title').oninput=e=>$('previewTitle').textContent=e.target.value;
$('renderBtn').onclick=async()=>{try{const clips=[...selected].map(i=>videos[i]);if(!clips.length)throw new Error('영상 클립을 먼저 선택하세요');$('status').textContent='렌더링 중...';const d=await json('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({clips,title:$('title').value,captions:currentCaptions,duration:20})});$('status').innerHTML=`완료: ${d.filename}<br><a class="download" href="${d.url}" target="_blank">완성 MP4 열기</a>`}catch(e){$('status').textContent='실패: '+e.message}};
health();
</script></body></html>
