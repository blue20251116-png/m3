<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>M3 API Settings</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0}.link{color:#fff;text-decoration:none;border:1px solid #303844;border-radius:10px;padding:9px 12px}.panel{background:#13171d;border:1px solid #252b34;border-radius:18px;padding:20px;margin-bottom:16px}.field{margin:18px 0}.field label{display:block;font-weight:800;margin-bottom:8px}.hint{font-size:13px;color:#8f9aaa;line-height:1.6}.status{font-size:13px;margin-top:8px;color:#aeb8c5}input{width:100%;font:inherit;border-radius:12px;border:1px solid #303844;background:#0e1217;color:#fff;padding:12px}button{font:inherit;border:0;border-radius:12px;background:#fff;color:#111;font-weight:900;padding:12px 18px;cursor:pointer}.danger{background:#2a1717;color:#ffb4b4}.row{display:flex;gap:10px;flex-wrap:wrap}.notice{padding:12px;border-radius:12px;background:#151b22;color:#aab4c1;font-size:13px;line-height:1.6}.ok{color:#8ce0a0}.off{color:#ff9f9f}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>API 설정</h1><div class="hint">Pexels / Pixabay 키를 관리자 화면에서 설정합니다</div></div><a class="link" href="/">← 편집기로</a></div>
<div class="panel">
  <div class="field"><label>Pexels API Key</label><input id="pexels" type="password" autocomplete="off" placeholder="새 키를 입력하면 기존 키를 교체합니다"/><div id="pexelsStatus" class="status"></div></div>
  <div class="field"><label>Pixabay API Key</label><input id="pixabay" type="password" autocomplete="off" placeholder="새 키를 입력하면 기존 키를 교체합니다"/><div id="pixabayStatus" class="status"></div></div>
  <div class="row"><button id="saveBtn">저장</button><button id="clearPexels" class="danger">Pexels 키 삭제</button><button id="clearPixabay" class="danger">Pixabay 키 삭제</button></div>
  <div id="message" class="status"></div>
</div>
<div class="notice">보안상 저장된 키 전체 값은 다시 표시하지 않고 일부만 마스킹해서 보여줍니다. Railway에서 영구 보존하려면 WORK_DIR 또는 M3_SETTINGS_FILE이 영구 볼륨을 가리키도록 설정하는 편이 좋습니다.</div>
</div>
<script>
const $=id=>document.getElementById(id);
async function json(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw new Error(d.error||r.statusText);return d}
function showStatus(id,item){$(id).innerHTML=item.configured?`<span class="ok">설정됨</span> · ${item.masked}`:`<span class="off">설정 안 됨</span>`}
async function load(){const d=await json('/api/admin/settings');showStatus('pexelsStatus',d.PEXELS_API_KEY);showStatus('pixabayStatus',d.PIXABAY_API_KEY)}
async function save(payload){$('message').textContent='저장 중...';const d=await json('/api/admin/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});showStatus('pexelsStatus',d.settings.PEXELS_API_KEY);showStatus('pixabayStatus',d.settings.PIXABAY_API_KEY);$('pexels').value='';$('pixabay').value='';$('message').textContent='저장 완료'}
$('saveBtn').onclick=()=>{const payload={};if($('pexels').value.trim())payload.PEXELS_API_KEY=$('pexels').value.trim();if($('pixabay').value.trim())payload.PIXABAY_API_KEY=$('pixabay').value.trim();save(payload).catch(e=>$('message').textContent='실패: '+e.message)};
$('clearPexels').onclick=()=>save({PEXELS_API_KEY:''}).catch(e=>$('message').textContent='실패: '+e.message);
$('clearPixabay').onclick=()=>save({PIXABAY_API_KEY:''}).catch(e=>$('message').textContent='실패: '+e.message);
load().catch(e=>$('message').textContent='불러오기 실패: '+e.message);
</script></body></html>
