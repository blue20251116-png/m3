<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M3 중국 병맛 더빙</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;color:#97a3b2}.link{color:#fff;text-decoration:none;border:1px solid #303844;border-radius:999px;padding:8px 12px}.panel{background:#13171d;border:1px solid #252b34;border-radius:18px;padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,button,textarea{font:inherit;border:1px solid #303844;background:#0e1217;color:#fff;border-radius:11px;padding:9px 10px}button{cursor:pointer;background:#fff;color:#111;font-weight:800}button.secondary{background:#1b222b;color:#fff}button:disabled{opacity:.45;cursor:default}.small{font-size:12px;color:#98a4b3}.summary{line-height:1.55;color:#d9e0e8}.speakerGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.speaker{border:1px solid #2b333d;border-radius:13px;padding:12px;background:#0f1318}.speakerTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.speaker select{width:100%;margin-top:8px}.character{font-size:12px;color:#aeb8c5;margin-top:7px}.dialogues{display:grid;gap:8px}.dialogue{display:grid;grid-template-columns:90px 100px 1fr 1fr;gap:8px;align-items:start;border:1px solid #262e38;border-radius:12px;padding:9px}.dialogue .time{font-size:12px;color:#9da8b6;padding-top:8px}.dialogue .speakerId{font-weight:800;padding-top:8px}.dialogue textarea{min-height:68px;width:100%;resize:vertical;line-height:1.35}.orig{font-size:12px;color:#aeb8c5;white-space:pre-wrap;padding:8px;background:#0b0f14;border-radius:9px;min-height:68px}.status{font-size:13px;color:#c3ccd7;margin-top:10px}.result video{width:min(360px,100%);max-height:640px;background:#000;border-radius:14px;margin-top:10px}.result a{display:inline-block;margin-top:10px;color:#fff}.rangeBox{display:flex;align-items:center;gap:10px}.rangeBox input{width:220px;padding:0}.pill{font-size:12px;border:1px solid #303844;border-radius:999px;padding:5px 9px;color:#ccd5df}.warn{color:#f1c27d}@media(max-width:760px){.dialogue{grid-template-columns:1fr}.dialogue .time,.dialogue .speakerId{padding-top:0}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="hero"><div><h1>🇨🇳 중국 병맛 멀티 더빙</h1><p>화자 수 제한 없음 · 중국어 화자 분리 · 한국식 병맛 대본 · 화자별 TTS</p></div><div class="row"><a class="link" href="/">기존 M3</a><a class="link" href="/admin">API 설정</a></div></div>
<div class="panel"><h2>1. 원본 영상</h2><div class="row"><input id="file" type="file" accept="video/*"><select id="humor"><option value="original">원본형</option><option value="variety" selected>예능형</option><option value="max">병맛 MAX</option></select><button id="uploadAnalyze">업로드 + 자동 분석</button></div><div id="uploadStatus" class="status">중국어 대사가 포함된 영상을 선택하세요.</div><video id="sourcePreview" controls playsinline style="display:none;width:min(360px,100%);margin-top:12px;border-radius:14px;background:#000"></video></div>
<div class="panel"><h2>2. AI 분석 결과</h2><div id="summary" class="summary small">아직 분석되지 않았습니다.</div><div id="speakerCount" class="small" style="margin:12px 0"></div><div id="speakers" class="speakerGrid"></div></div>
<div class="panel"><h2>3. 병맛 대본 편집</h2><div class="small" style="margin-bottom:10px">원문은 보존하고 한국어 대사만 수정하세요. 같은 화자는 같은 TTS 목소리를 사용합니다.</div><div id="dialogues" class="dialogues"></div></div>
<div class="panel"><h2>4. 최종 더빙 렌더</h2><div class="rangeBox"><span class="small">원본 음성 볼륨</span><input id="originalVolume" type="range" min="0" max="40" step="1" value="12"><span id="originalVolumeVal" class="pill">12%</span></div><div class="row" style="margin-top:14px"><button id="render" disabled>🎬 한국어 더빙 MP4 만들기</button></div><div class="small warn" style="margin-top:10px">V1은 원본 오디오를 낮게 유지하고 한국어 TTS를 위에 믹싱합니다. 대사 제거·BGM/SFX 완전 분리는 다음 단계입니다.</div><div id="renderStatus" class="status"></div><div id="result" class="result"></div></div>
</div><script src="/dubbing.js"></script></body></html>
